[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ThematicAtlases"
version = "5.0.0"
description = "Tools for building thematic atlases of biomedical datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = []
dependencies = [
    "agentic-curator>=5,<6",
    "google-auth>=2,<3",
    "meta-standards-converter>=7,<8",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
thematic-atlas = "ThematicAtlases.cli_atlas:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"benchmark_ThematicAtlases.benchmark_fibrosis_meta_pubs_recall" = ["*.tsv"]
"benchmark_ThematicAtlases.benchmark_fibrosis_meta_pubs_review" = ["*.csv", "*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
